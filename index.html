<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c3157">
  <meta name="description" content="Book Simba Coach bus tickets across Kenya and East Africa.">
  <title>Simba Coach Bus Tickets Online | Kenya &amp; East Africa</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #1c3157;
      --navy-dark: #172a4d;
      --red: #b6232a;
      --red-soft: #f4dadd;
      --text: #1c2431;
      --muted: #697386;
      --line: #e0e2e6;
      --surface: #fff;
      --page: #f7f8fa;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: white; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .site-header {
      height: 98px; display: flex; align-items: center; justify-content: space-between;
      padding: 12px max(24px, calc((100vw - 1200px) / 2)); background: var(--navy);
      border-bottom: 3px solid var(--red); color: white;
    }
    .brand { display: flex; align-items: center; min-width: 205px; }
    .brand img { display: block; width: 220px; height: auto; max-height: 75px; object-fit: contain; }
    .header-actions { display: flex; align-items: center; gap: 22px; }
    .phone-pill {
      display: inline-flex; align-items: center; gap: 10px; border: 1px solid #7182a1;
      border-radius: 28px; padding: 11px 19px; background: #2a416b; color: white;
      text-decoration: none; font-size: 16px; font-weight: 750; white-space: nowrap;
    }
    .menu-button {
      display: grid; place-items: center; width: 42px; height: 42px; border: 0;
      color: white; background: transparent; font-size: 26px;
    }
    .menu-panel {
      position: absolute; z-index: 5; right: max(20px, calc((100vw - 1200px) / 2));
      top: 82px; display: none; width: 230px; padding: 10px; border: 1px solid var(--line);
      border-radius: 12px; background: white; box-shadow: 0 12px 30px #0e1d3726;
    }
    .menu-panel.open { display: grid; }
    .menu-panel a { padding: 11px 12px; color: var(--text); text-decoration: none; border-radius: 8px; }
    .menu-panel a:hover { background: #f0f2f6; }
    .route-banner { background: var(--navy); color: white; padding: 32px max(24px, calc((100vw - 1200px) / 2)) 34px; }
    .back-button {
      display: inline-flex; align-items: center; gap: 12px; border: 0; padding: 7px 12px 7px 0;
      color: #d8dfeb; background: transparent; font-size: 16px;
    }
    .route-title { display: flex; align-items: center; gap: 12px; margin: 30px 0 6px; font-size: 25px; font-weight: 760; }
    .route-date { margin: 0; color: #c4cddd; font-size: 17px; }
    main { width: min(1200px, 100%); margin: 0 auto; padding: 30px 24px 48px; }
    .class-tabs { display: flex; gap: 12px; overflow-x: auto; padding: 6px 0 8px; margin-bottom: 30px; }
    .class-tab {
      display: flex; align-items: center; gap: 13px; flex: 0 0 auto; min-height: 54px;
      padding: 10px 17px; border: 1px solid #d9dce2; border-radius: 11px; background: white;
      color: var(--text); font-size: 17px; font-weight: 650;
    }
    .class-tab.active { border-color: var(--navy); background: var(--navy); color: white; }
    .tab-count { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--red); color: white; font-size: 14px; }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.4px; }
    .result-subtitle { margin: 0 0 24px; color: var(--muted); font-size: 19px; font-weight: 650; }
    .bus-list { display: grid; gap: 16px; }
    .bus-card { padding: 24px; border: 1px solid #d9dce2; border-radius: 14px; background: white; box-shadow: 0 2px 5px #172a4d08; }
    .bus-top { display: flex; align-items: start; justify-content: space-between; gap: 24px; }
    .bus-left { flex: 1; min-width: 0; }
    .bus-class { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 10px; padding: 6px 14px; border-radius: 20px; background: var(--navy); color: white; font-size: 13px; font-weight: 700; }
    .journey { display: grid; grid-template-columns: minmax(90px, auto) 80px minmax(120px, auto); align-items: center; gap: 14px; }
    .time { font-size: 21px; font-weight: 750; }
    .city { margin-top: 2px; color: var(--muted); font-size: 14px; text-align: center; }
    .journey > div:first-child .city { text-align: center; }
    .duration { display: grid; justify-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
    .duration-line { width: 100%; height: 1px; background: #c8ccd3; position: relative; }
    .duration-line::after { content: "▰"; position: absolute; left: 50%; top: -10px; padding: 0 4px; color: var(--navy); background: white; transform: translateX(-50%); font-size: 13px; }
    .price-block { min-width: 160px; text-align: right; }
    .price { color: var(--navy); font-size: 28px; font-weight: 800; white-space: nowrap; }
    .seats-left { margin-top: 4px; color: var(--red); font-size: 14px; white-space: nowrap; }
    .amenities { display: flex; flex-wrap: wrap; gap: 9px; margin: 20px 0 18px; }
    .amenity { padding: 6px 12px; border-radius: 20px; background: #f3f4f6; color: #697386; font-size: 13px; }
    .primary-button {
      width: 100%; min-height: 54px; padding: 12px 20px; border: 0; border-radius: 9px;
      background: var(--navy); color: white; font-size: 20px; font-weight: 750;
    }
    .primary-button:hover:not(:disabled) { background: var(--navy-dark); }
    .primary-button:disabled { cursor: not-allowed; opacity: .48; }
    .search-form {
      display: grid; grid-template-columns: 1fr 1fr 1fr 130px; gap: 13px; margin: 0 0 28px;
      padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: white;
    }
    .field { display: grid; gap: 7px; }
    .field label { color: var(--muted); font-size: 13px; font-weight: 650; }
    .field input, .field select { width: 100%; min-height: 45px; padding: 10px 12px; border: 1px solid #ccd1d9; border-radius: 8px; background: white; color: var(--text); }
    .search-form .primary-button { align-self: end; min-height: 45px; font-size: 16px; }
    .seat-main { max-width: 920px; }
    .step-heading { margin: 0; color: white; font-size: 27px; font-weight: 760; }
    .step-subheading { margin: 7px 0 0; color: #c4cddd; font-size: 16px; }
    .seat-layout { display: grid; justify-items: center; }
    .seat-instructions { margin: 6px 0 22px; color: var(--muted); font-size: 19px; text-align: center; }
    .legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin: 0 0 28px; color: var(--muted); }
    .legend-item { display: inline-flex; align-items: center; gap: 8px; }
    .legend-swatch { width: 22px; height: 22px; border-radius: 7px; border: 1px solid #d3d6dc; background: white; box-shadow: 0 3px 0 #dfe1e5; }
    .legend-swatch.vip { background: var(--red-soft); box-shadow: 0 3px 0 #d38389; }
    .legend-swatch.selected { background: var(--navy); box-shadow: 0 3px 0 #112341; }
    .legend-swatch.taken { background: #c8cbd0; box-shadow: 0 3px 0 #aeb2b9; }
    .bus-shell { position: relative; width: min(100%, 460px); padding: 46px 22px 26px; border: 3px solid #dfe1e6; border-radius: 20px 20px 0 0; background: white; }
    .bus-shell::before { content: ""; position: absolute; top: -32px; left: 8%; width: 84%; height: 42px; border-radius: 65px 65px 0 0; background: #e6e8ed; box-shadow: inset 0 -9px 14px #d4d7de; z-index: -1; }
    .bus-front { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px dashed #d5d8de; color: #697386; font-size: 12px; text-transform: uppercase; }
    .driver { display: grid; place-items: center; width: 50px; height: 50px; border: 2px solid #e2e4e9; border-radius: 50%; background: #f5f6f8; font-size: 11px; }
    .vip-heading { margin: 21px 0 14px; color: var(--red); text-align: center; font-size: 14px; font-weight: 750; text-transform: uppercase; }
    .seat-grid { display: grid; grid-template-columns: repeat(3, minmax(58px, 1fr)); gap: 13px 10px; max-width: 270px; margin: 0 auto; }
    .seat {
      position: relative; min-height: 65px; border: 1px solid #e1e3e8; border-radius: 13px;
      background: white; color: var(--navy); box-shadow: 0 4px 0 #dfe1e5; font-weight: 700;
    }
    .seat:nth-child(3n + 1) { background: var(--red-soft); color: #9e252c; box-shadow: 0 4px 0 #d38389; }
    .seat:nth-child(3n + 2) { margin-right: 10px; }
    .seat:nth-child(3n) { margin-left: 10px; }
    .seat.selected { border-color: var(--navy); background: var(--navy); color: white; box-shadow: 0 4px 0 #112341; }
    .seat.taken { cursor: not-allowed; border-color: #c8cbd0; background: #c8cbd0; color: white; box-shadow: 0 4px 0 #aeb2b9; }
    .seat-summary { width: min(100%, 460px); margin-top: 24px; padding: 19px 20px; border: 1px solid var(--line); border-radius: 13px; background: white; }
    .seat-summary h2 { margin: 0 0 15px; font-size: 19px; }
    .summary-row { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); }
    .summary-row + .summary-row { margin-top: 9px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--text); font-weight: 750; }
    .booking-card { max-width: 680px; margin: 0 auto; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: white; }
    .booking-card h2 { margin: 0 0 8px; font-size: 21px; }
    .booking-card > p { margin: 0 0 20px; color: var(--muted); }
    .booking-form { display: grid; gap: 16px; }
    .booking-summary { margin-bottom: 22px; padding: 15px; border-radius: 10px; background: #f4f6f9; line-height: 1.7; }
    .booking-note { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .site-footer { padding: 28px 24px; background: var(--navy-dark); color: #dbe2ee; text-align: center; }
    .site-footer p { margin: 5px 0; }
    .site-footer a { color: white; }
    .empty-state { padding: 30px; border: 1px solid var(--line); border-radius: 14px; background: white; color: var(--muted); text-align: center; }
    @media (max-width: 700px) {
      .site-header { height: 66px; padding: 6px 16px; }
      .brand { min-width: 0; }
      .brand img { width: min(34vw, 150px); max-height: 66px; }
      .header-actions { gap: 8px; }
      .phone-pill { gap: 7px; padding: 8px 9px; font-size: 11px; }
      .menu-button { width: 34px; }
      .route-banner { padding: 16px 20px 18px; }
      .route-title { margin-top: 17px; font-size: 21px; }
      main { padding: 18px 16px 36px; }
      .class-tabs { gap: 8px; margin-bottom: 12px; }
      .class-tab { min-height: 36px; gap: 7px; padding: 7px 10px; font-size: 14px; }
      .tab-count { width: 20px; height: 20px; font-size: 12px; }
      h1 { font-size: 18px; }
      .result-subtitle { margin-bottom: 17px; font-size: 15px; }
      .bus-card { padding: 16px; }
      .bus-top { gap: 8px; }
      .journey { grid-template-columns: 1fr 55px 1fr; gap: 6px; }
      .bus-class { margin-bottom: 6px; padding: 4px 12px; font-size: 12px; }
      .time { font-size: 14px; }
      .city { font-size: 13px; }
      .price-block { min-width: 112px; }
      .price { font-size: 20px; }
      .seats-left { font-size: 12px; }
      .amenities { gap: 6px; margin: 12px 0; }
      .amenity { padding: 3px 8px; font-size: 11px; }
      .primary-button { min-height: 36px; padding: 8px 14px; font-size: 16px; }
      .search-form { grid-template-columns: 1fr 1fr; padding: 14px; }
      .search-form .primary-button { grid-column: span 2; }
      .step-heading { font-size: 24px; }
      .seat-instructions { font-size: 16px; }
    }
    @media (max-width: 420px) {
      .phone-pill { padding: 9px 10px; font-size: 12px; }
      .brand img { width: 39vw; }
      .bus-top { display: block; }
      .price-block { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 16px; text-align: left; }
      .price { font-size: 23px; }
      .seats-left { margin-top: 0; }
      .seat-grid { gap: 11px 8px; }
      .seat { min-height: 58px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="?home=1" aria-label="Simba Coach home"><img src="./simba-logo.webp" alt="Simba Coach Ltd"></a>
    <div class="header-actions">
      <a class="phone-pill" href="tel:+254105686866" aria-label="Call Simba Coach">
        <span aria-hidden="true">☎</span><span>+254 105 686 866</span>
      </a>
      <button class="menu-button" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
    <nav class="menu-panel" id="menu-panel" aria-label="Main menu">
      <a href="?home=1">Search buses</a>
      <a href="mailto:infosimbacoachbus@gmail.com">infosimbacoachbus@gmail.com</a>
      <a href="tel:+254105686866">Call +254 105 686 866</a>
    </nav>
  </header>
  <div id="app"></div>
  <footer class="site-footer">
    <p>Simba Coach — The Pride of Travellers</p>
    <p><a href="tel:+254105686866">+254 105 686 866</a> · <a href="mailto:infosimbacoachbus@gmail.com">infosimbacoachbus@gmail.com</a></p>
  </footer>
  <script>
    const contactNumber = "254105686866";
    const contactEmail = "infosimbacoachbus@gmail.com";
    const buses = [
      { id: "nrb-dar-8pm-vip", className: "VIP", time: "08:00 PM", price: 5000, left: 12, amenities: ["2+1 seating", "Extra legroom", "USB charging", "Refreshments"], taken: [2, 3, 5, 12, 14, 15, 16, 17, 18, 19, 21, 23] },
      { id: "nrb-dar-10pm-standard", className: "Standard", time: "10:00 PM", price: 3500, left: 9, amenities: ["2+3 seating", "Comfortable seats", "Affordable"], taken: [2, 5, 12, 14, 17, 19, 22, 26, 28] }
    ];
    const params = new URLSearchParams(location.search);
    const currentParams = () => new URLSearchParams(location.search);
    const app = document.querySelector("#app");
    const state = {
      from: params.get("from") || "Nairobi",
      to: params.get("to") || "Dar es Salaam",
      date: params.get("date") || "2026-10-22",
      pax: Math.max(1, Number(params.get("pax") || 1)),
      filter: "All Classes",
      selectedSeats: (params.get("seats") || "").split(",").filter(Boolean).map(Number),
      bookingBus: buses.find(bus => bus.id === params.get("schedule")) || buses[0]
    };
    const stepFromLocation = () => {
      const query = currentParams();
      if (query.get("step")) return query.get("step");
      if (location.pathname.includes("booking")) return "booking";
      if (location.pathname.includes("select-seat")) return "seats";
      if (location.pathname.includes("/search") || query.has("from") || query.has("to")) return "search";
      return "home";
    };
    const dateLabel = value => {
      const [year, month, day] = value.split("-").map(Number);
      return new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "2-digit", month: "short", year: "numeric" })
        .format(new Date(year, month - 1, day));
    };
    const routeQuery = () => new URLSearchParams({
      from: state.from, to: state.to, date: state.date, pax: String(state.pax)
    });
    const routeTitle = () => `${state.from} to ${state.to}`;
    const routeUrl = (step, extra = {}) => {
      const query = routeQuery();
      query.set("step", step);
      Object.entries(extra).forEach(([key, value]) => query.set(key, String(value)));
      if (step === "home") query.set("home", "1");
      return `${location.pathname}?${query}`;
    };
    const pushRoute = (step, extra) => { history.pushState({}, "", routeUrl(step, extra)); render(); window.scrollTo(0, 0); };
    const routeBanner = (title, subtitle, backLabel = "Back") => `
      <section class="route-banner">
        <button class="back-button" data-action="back" type="button"><span aria-hidden="true">←</span>${backLabel}</button>
        <h1 class="step-heading">${title}</h1>
        ${subtitle ? `<p class="step-subheading">${subtitle}</p>` : ""}
      </section>`;

    function renderHome() {
      app.innerHTML = `
        <section class="route-banner">
          <h1 class="step-heading">Book your next journey</h1>
          <p class="step-subheading">Comfortable bus travel across Kenya and East Africa</p>
        </section>
        <main>
          <form class="search-form" id="search-form">
            <div class="field"><label for="from">From</label><input id="from" name="from" value="${escapeHtml(state.from)}" required></div>
            <div class="field"><label for="to">To</label><input id="to" name="to" value="${escapeHtml(state.to)}" required></div>
            <div class="field"><label for="date">Travel date</label><input id="date" name="date" type="date" value="${escapeHtml(state.date)}" required></div>
            <div class="field"><label for="pax">Passengers</label><select id="pax" name="pax">${[1,2,3,4,5,6].map(n => `<option value="${n}" ${n === state.pax ? "selected" : ""}>${n}</option>`).join("")}</select></div>
            <button class="primary-button" type="submit">Search buses</button>
          </form>
        </main>`;
      document.querySelector("#search-form").addEventListener("submit", event => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        state.from = String(form.get("from")).trim();
        state.to = String(form.get("to")).trim();
        state.date = String(form.get("date"));
        state.pax = Number(form.get("pax"));
        pushRoute("search");
      });
    }

    function renderSearch() {
      const visibleBuses = state.filter === "All Classes" ? buses : buses.filter(bus => bus.className === state.filter);
      const counts = { "All Classes": 5, VIP: 1, Executive: 1, Standard: 3 };
      app.innerHTML = `
        <section class="route-banner">
          <button class="back-button" data-action="back" type="button"><span aria-hidden="true">←</span>Back</button>
          <h1 class="route-title"><span aria-hidden="true">⌖</span>${escapeHtml(state.from)} <span aria-hidden="true">→</span> ${escapeHtml(state.to)}</h1>
          <p class="route-date">${dateLabel(state.date)}</p>
        </section>
        <main>
          <nav class="class-tabs" aria-label="Filter bus class">
            ${Object.entries(counts).map(([name,count]) => `<button type="button" class="class-tab ${state.filter === name ? "active" : ""}" data-filter="${name}">${name === "VIP" ? "♛ " : name === "Executive" ? "☆ " : name === "Standard" ? "♙ " : ""}${name}<span class="tab-count">${count}</span></button>`).join("")}
          </nav>
          <h1>${escapeHtml(routeTitle())} Bus Tickets</h1>
          <p class="result-subtitle">${visibleBuses.length} ${visibleBuses.length === 1 ? "bus" : "buses"} available · ${dateLabel(state.date)}</p>
          <section class="bus-list" aria-label="Available buses">
            ${visibleBuses.length ? visibleBuses.map(bus => `
              <article class="bus-card">
                <div class="bus-top">
                  <div class="bus-left">
                    <span class="bus-class">${bus.className === "VIP" ? "♛ " : bus.className === "Executive" ? "☆ " : ""}${bus.className}</span>
                    <div class="journey">
                      <div><div class="time">${bus.time}</div><div class="city">${escapeHtml(state.from)}</div></div>
                      <div class="duration"><span class="duration-line"></span><span>14–16 hrs</span></div>
                      <div><div class="city">${escapeHtml(state.to)}</div></div>
                    </div>
                  </div>
                  <div class="price-block"><div class="price">KES ${bus.price.toLocaleString("en-KE")}</div><div class="seats-left">♨ Only ${bus.left} seats left</div></div>
                </div>
                <div class="amenities">${bus.amenities.map(item => `<span class="amenity">${item}</span>`).join("")}</div>
                <button class="primary-button" data-select="${bus.id}" type="button">Select Seat</button>
              </article>`).join("") : `<p class="empty-state">No buses found for this class. Choose another class to see available trips.</p>`}
          </section>
        </main>`;
      document.querySelectorAll("[data-filter]").forEach(button => button.addEventListener("click", () => {
        state.filter = button.dataset.filter;
        renderSearch();
      }));
      document.querySelectorAll("[data-select]").forEach(button => button.addEventListener("click", () => {
        state.bookingBus = buses.find(bus => bus.id === button.dataset.select);
        state.selectedSeats = [];
        pushRoute("seats", { schedule: state.bookingBus.id, passengers: state.pax });
      }));
    }

    function renderSeats() {
      const bus = state.bookingBus;
      const total = state.selectedSeats.length * bus.price;
      app.innerHTML = `
        ${routeBanner("Select Your Seat", `${state.from} → ${state.to} · ${bus.className} · ${bus.time}`)}
        <main class="seat-main">
          <p class="seat-instructions">Pick as many seats as you need (${state.selectedSeats.length} selected)</p>
          <div class="legend" aria-label="Seat legend">
            <span class="legend-item"><span class="legend-swatch"></span>Available</span>
            <span class="legend-item"><span class="legend-swatch vip"></span>${bus.className}</span>
            <span class="legend-item"><span class="legend-swatch selected"></span>Selected</span>
            <span class="legend-item"><span class="legend-swatch taken"></span>Taken</span>
          </div>
          <section class="seat-layout" aria-label="Bus seat map">
            <div class="bus-shell">
              <div class="bus-front"><span>♧ &nbsp; Entry</span><span class="driver">DRV</span></div>
              <div class="vip-heading">${bus.className === "VIP" ? "♛ &nbsp;" : ""}${bus.className} Section${bus.className === "VIP" ? " &nbsp; ♛" : ""}</div>
              <div class="seat-grid">
                ${Array.from({length: 24}, (_, i) => i + 1).map(number => {
                  const taken = bus.taken.includes(number);
                  const selected = state.selectedSeats.includes(number);
                  return `<button type="button" class="seat ${taken ? "taken" : ""} ${selected ? "selected" : ""}" data-seat="${number}" ${taken ? "disabled" : ""} aria-label="Seat ${number}${taken ? " taken" : selected ? " selected" : ""}">${number}</button>`;
                }).join("")}
              </div>
            </div>
            <section class="seat-summary">
              <h2>Price Summary</h2>
              <div class="summary-row"><span>Seat: ${state.selectedSeats.length ? state.selectedSeats.join(", ") : "–"}</span><span>KES ${total.toLocaleString("en-KE")}</span></div>
              <div class="summary-row"><span>Total</span><span>KES ${total.toLocaleString("en-KE")}</span></div>
            </section>
            <button class="primary-button" id="continue-booking" type="button" ${state.selectedSeats.length < state.pax ? "disabled" : ""} style="max-width:460px;margin-top:16px">Continue to Booking</button>
          </section>
        </main>`;
      document.querySelectorAll("[data-seat]").forEach(button => button.addEventListener("click", () => {
        const seat = Number(button.dataset.seat);
        state.selectedSeats = state.selectedSeats.includes(seat)
          ? state.selectedSeats.filter(value => value !== seat)
          : [...state.selectedSeats, seat].sort((a, b) => a - b);
        renderSeats();
      }));
      document.querySelector("#continue-booking").addEventListener("click", () => {
        pushRoute("booking", { schedule: bus.id, seats: state.selectedSeats.join(",") });
      });
    }

    function renderBooking() {
      const bus = state.bookingBus;
      const total = state.selectedSeats.length * bus.price;
      app.innerHTML = `
        ${routeBanner("Passenger Details", `${state.from} → ${state.to} · ${bus.className} · ${bus.time}`)}
        <main>
          <section class="booking-card">
            <h2>Complete your booking</h2>
            <p>Enter the lead passenger’s details. We’ll open WhatsApp with your trip request ready to send.</p>
            <div class="booking-summary">
              <strong>${escapeHtml(routeTitle())}</strong><br>
              ${dateLabel(state.date)} · ${bus.time} · ${bus.className}<br>
              Seat${state.selectedSeats.length === 1 ? "" : "s"} ${state.selectedSeats.join(", ")} · KES ${total.toLocaleString("en-KE")}
            </div>
            <form class="booking-form" id="booking-form">
              <div class="field"><label for="passenger-name">Passenger name</label><input id="passenger-name" name="name" autocomplete="name" required maxlength="100"></div>
              <div class="field"><label for="passenger-phone">Mobile number</label><input id="passenger-phone" name="phone" type="tel" autocomplete="tel" required maxlength="30" placeholder="+254 7XX XXX XXX"></div>
              <button class="primary-button" type="submit">Continue on WhatsApp</button>
              <p class="booking-note">Your booking request is sent to Simba Coach via WhatsApp after you press Send in WhatsApp. No payment is collected on this page. For help, email <a href="mailto:${contactEmail}">${contactEmail}</a>.</p>
            </form>
          </section>
        </main>`;
      document.querySelector("#booking-form").addEventListener("submit", event => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const passengerName = String(form.get("name")).trim();
        const passengerPhone = String(form.get("phone")).trim();
        const message = [
          "Hello Simba Coach, I would like to request a bus booking.",
          `Passenger: ${passengerName}`,
          `Phone: ${passengerPhone}`,
          `Route: ${state.from} to ${state.to}`,
          `Travel date: ${dateLabel(state.date)}`,
          `Bus: ${bus.className}, ${bus.time}`,
          `Seat${state.selectedSeats.length === 1 ? "" : "s"}: ${state.selectedSeats.join(", ")}`,
          `Total: KES ${total.toLocaleString("en-KE")}`
        ].join("\n");
        location.href = `https://wa.me/${contactNumber}?text=${encodeURIComponent(message)}`;
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }
    function render() {
      const step = stepFromLocation();
      if (step === "seats") renderSeats();
      else if (step === "booking") renderBooking();
      else if (step === "home") renderHome();
      else renderSearch();
    }
    document.querySelector("#menu-toggle").addEventListener("click", event => {
      const panel = document.querySelector("#menu-panel");
      panel.classList.toggle("open");
      event.currentTarget.setAttribute("aria-expanded", String(panel.classList.contains("open")));
    });
    document.addEventListener("click", event => {
      const action = event.target.closest("[data-action='back']");
      if (!action) return;
      if (stepFromLocation() === "booking") pushRoute("seats", { schedule: state.bookingBus.id, passengers: state.pax, seats: state.selectedSeats.join(",") });
      else if (stepFromLocation() === "seats") pushRoute("search");
      else pushRoute("home");
    });
    window.addEventListener("popstate", render);
    render();
  </script>
</body>
</html>
